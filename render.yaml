# Render 部署設定（Static Site）
# 使用方法：把專案推到 GitHub，到 Render 後台 New → Blueprint，選這個 repo 即可自動建立。
services:
  - type: web
    name: lumiatelier
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # 單頁應用：任何路徑都回 index.html（讓前端路由自行處理）
      - type: rewrite
        source: /*
        destination: /index.html
